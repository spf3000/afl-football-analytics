version: 2

models:
  - name: crowd_analysis
    description: >
      Match-level enriched table for attendance analytics.
      Includes venue details, benchmark averages, and calculated metrics
      for flexible analysis in notebooks. Deviations from averages should
      be calculated in the analysis layer.
    columns:
      - name: match_id
        description: "Surrogate key for the match"
        tests:
          - unique
          - not_null
      - name: season
        description: "AFL season year"
        tests:
          - not_null
      - name: round
        description: "Round name (e.g., Round 1, Qualifying Final)"
        tests:
          - not_null
      - name: match_datetime
        description: "Date and time of the match"
        tests:
          - not_null
      - name: home_team_id
        description: "Foreign key to dim_teams for home team"
        tests:
          - not_null
      - name: away_team_id
        description: "Foreign key to dim_teams for away team"
        tests:
          - not_null
      - name: venue_id
        description: "Foreign key to dim_venues"
      - name: attendance
        description: "Crowd size at the match"
      - name: utilization_pct
        description: "Attendance as percentage of venue capacity (0-100+)"
      - name: is_finals
        description: "TRUE if this is a finals match"
        tests:
          - not_null
      - name: season_round_num
        description: "Numeric round for ordering (1-24 for H&A, 25-28 for finals)"
      - name: home_team_season_match_num
        description: "This is the home team's Nth home game of the season"
      - name: away_team_season_match_num
        description: "This is the away team's Nth away game of the season"
      - name: home_team_season_avg
        description: "Home team's average attendance at all their home games this season"
      - name: home_team_venue_season_avg
        description: "Home team's average attendance at THIS venue this season (venue-adjusted benchmark)"
      - name: away_team_home_season_avg
        description: "Away team's average attendance when THEY host (for comparison)"

  - name: elo_ratings
    description: >
      Team-level Elo ratings computed chronologically across all AFL matches
      in fct_matches. One row per team per match (2 rows per game). Ratings
      start at 1500. Each match is scored as a margin-based outcome,
      1 / (1 + exp(-margin / 30)), so a draw = 0.5 and a big win approaches 1.
      Ratings update by K × (outcome − expected), with K = 40, so no single
      match can move a rating more than K points. The home team gets a
      45-point Elo advantage, and ratings regress 1/3 toward 1500 between
      seasons. Changes are zero-sum within each match.
    columns:
      - name: elo_record_id
        description: "Surrogate key (match_id + team_id)"
        tests:
          - unique
          - not_null
      - name: match_id
        description: "Foreign key to fct_matches"
        tests:
          - not_null
      - name: team_id
        description: "Foreign key to dim_teams for this team"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: team_name
        description: "Team name"
        tests:
          - not_null
      - name: opponent_team_id
        description: "Foreign key to dim_teams for the opponent"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: opponent_team_name
        description: "Opponent team name"
        tests:
          - not_null
      - name: season
        description: "AFL season year"
        tests:
          - not_null
      - name: round
        description: "Round name (e.g., Round 1, Qualifying Final)"
        tests:
          - not_null
      - name: match_datetime
        description: "Date and time of the match"
        tests:
          - not_null
      - name: is_home
        description: "TRUE if this team was the home team"
        tests:
          - not_null
      - name: pre_match_elo
        description: "Team Elo rating before this match"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1000
                max_value: 2000
              severity: warn
      - name: opponent_pre_match_elo
        description: "Opponent Elo rating before this match"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1000
                max_value: 2000
              severity: warn
      - name: home_advantage_applied
        description: "Elo points of home advantage applied (45 for home team, 0 for away)"
        tests:
          - not_null
      - name: expected_win_prob
        description: >
          Pre-match expected outcome score from the Elo ratings (incl. home
          advantage). Used as the win probability in elo_evaluation; how well
          it is calibrated to actual win/loss is checked there.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0
                max_value: 1.0
      - name: actual_result
        description: "Match result: 1.0 = win, 0.5 = draw, 0.0 = loss"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1.0, 0.5, 0.0]
      - name: outcome_score
        description: >
          Margin-based match outcome, 1 / (1 + exp(-margin / 30)): 0.5 = draw,
          ~0.73 = 30-point win, ~0.88 = 60-point win. The value Elo updates
          against. actual_result (1 / 0.5 / 0) is kept for evaluation.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0
                max_value: 1.0
      - name: elo_change
        description: "Elo points gained or lost from this match"
        tests:
          - not_null
      - name: post_match_elo
        description: "Team Elo rating after this match"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1000
                max_value: 2000
              severity: warn
      - name: team_match_number
        description: "Cumulative match number for this team across all seasons"
        tests:
          - not_null
      - name: season_match_number
        description: "Match number for this team within the current season"
        tests:
          - not_null
  - name: elo_evaluation
    description: "Evaluation based on results of the calculated elos, using Brier score"
    columns:
      - name: season
        description: "year of play"
        tests:
          - not_null
      - name: games
        description: "number of games played"
      - name: brier
        description: "Brier score - averaged over the year"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0
                max_value: 1.0
