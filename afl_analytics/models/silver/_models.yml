version: 2

models:
  - name: dim_teams
    description: >
      Team dimension table containing AFL team metadata.
      Source: seed_teams.csv
    columns:
      - name: team_id
        description: "Short code identifier for the team (e.g., RIC, COL)"
        tests:
          - unique
          - not_null
      - name: squiggle_id
        description: "Numeric team id used by the Squiggle API (stable cross-source key)"
        tests:
          - unique
          - not_null
      - name: team_name
        description: "Full team name (e.g., Richmond, Collingwood)"
        tests:
          - not_null
      - name: nick_name
        description: "Team nickname (e.g., Tigers, Magpies)"
      - name: mascot
        description: "Team mascot name"
      - name: primary_colour
        description: "Primary team colour"
      - name: secondary_colour
        description: "Secondary team colour"
      - name: home_state
        description: "State where team is based"
      - name: home_city
        description: "City where team is based"
      - name: founded_year
        description: "Year the club was founded"

  - name: dim_venues
    description: >
      Venue dimension table containing AFL ground metadata.
      Includes historical and current sponsored names as aliases.
      Source: seed_venues.csv
    columns:
      - name: venue_id
        description: "Short code identifier for the venue (e.g., MCG, OPT)"
        tests:
          - unique
          - not_null
      - name: venue_name
        description: "Canonical venue name (e.g., Melbourne Cricket Ground)"
        tests:
          - not_null
      - name: current_sponsored_name
        description: "Current naming rights sponsor name (e.g., Optus Stadium)"
      - name: aliases
        description: "Semicolon-separated list of historical/alternative names"
      - name: city
        description: "City where venue is located"
        tests:
          - not_null
      - name: state
        description: "State or country where venue is located"
        tests:
          - not_null
      - name: capacity
        description: "Venue seating capacity"
      - name: first_afl_use
        description: "Year venue was first used for AFL/VFL matches"
      - name: current_tenants
        description: "Semicolon-separated list of teams using this as home ground"

  - name: fct_matches
    description: >
      Fact table containing AFL match results with foreign keys to dimension tables.
      Spine is stg_squiggle_games (Squiggle API); teams mapped via dim_teams.squiggle_id,
      venues via dim_venues. Crowd/attendance is joined from the legacy .txt path
      (stg_match_results) on season + team ids + match date, since Squiggle has no crowd.
    columns:
      - name: match_id
        description: "Surrogate key for the match (hash of the Squiggle game_id)"
        tests:
          - unique
          - not_null
      - name: game_id
        description: "Squiggle's unique game id (natural key)"
        tests:
          - unique
          - not_null
      - name: home_team_id
        description: "Foreign key to dim_teams for home team"
        tests:
          - not_null
          - relationships:
              to: ref('dim_teams')
              field: team_id
      - name: away_team_id
        description: "Foreign key to dim_teams for away team"
        tests:
          - not_null
          - relationships:
              to: ref('dim_teams')
              field: team_id
      - name: venue_id
        description: "Foreign key to dim_venues"
        tests:
          - relationships:
              to: ref('dim_venues')
              field: venue_id
      - name: season
        description: "AFL season year"
        tests:
          - not_null
      - name: round
        description: "Round name of the season (e.g., Round 1, Grand Final)"
        tests:
          - not_null
      - name: round_number
        description: "Numeric round (0 = Opening Round; finals continue the sequence)"
        tests:
          - not_null
      - name: is_final
        description: "TRUE if the match is a finals game"
      - name: is_grand_final
        description: "TRUE if the match is a Grand Final"
      - name: match_datetime
        description: "Date and time of the match"
        tests:
          - not_null
      - name: home_score
        description: "Total points scored by home team"
        tests:
          - not_null
      - name: away_score
        description: "Total points scored by away team"
        tests:
          - not_null
      - name: margin
        description: "Home score minus away score (positive = home win)"
        tests:
          - not_null
      - name: result
        description: "Match outcome from home team perspective"
        tests:
          - not_null
          - accepted_values:
              values: ['home_win', 'away_win', 'draw']
      - name: attendance
        description: "Crowd size at the match"
      - name: home_team_name
        description: "Home team name (raw value for reference)"
      - name: away_team_name
        description: "Away team name (raw value for reference)"
      - name: venue_name_raw
        description: "Venue name as recorded in source data"
